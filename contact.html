<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact • Streetz X Safe ATL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 🔥 Announcement Bar -->
  <div class="announcement">
    🔥 New Merch Live • High-Visibility Reflective Ride Gear • Streetz Aint Safe ATL
  </div>

  <!-- Floating Instagram Icon -->
  <a href="https://www.instagram.com/streetzaintsafeatl" target="_blank" rel="noopener noreferrer" class="igFloat" title="Follow on Instagram">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
    </svg>
  </a>

  <!-- 🔥 Navigation Header -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/logo.jpg" alt="Streetz X Safe Logo" />
      <span>Streetz X Safe</span>
    </a>

    <nav class="nav">
      <a href="merch.html">Shop</a>
      <a href="events.html">Events</a>
      <a href="join.html">Join</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="navToggle" aria-label="Open menu" aria-expanded="false">☰</button>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section class="page-title-section">
      <h1>Get In Touch</h1>
      <p>Send us a message and we'll get back to you regarding products, collaborations, or general questions.</p>
    </section>

    <!-- Contact Form Section -->
    <section class="section" style="padding-top: 0;">
      <div class="panel">
        <form id="contactform">
          <div class="form-grid two-cols">
            <div>
              <label for="name">Name</label>
              <input class="input" id="name" name="name" placeholder="YOUR NAME" required />
            </div>
            <div>
              <label for="email">Email</label>
              <input class="input" id="email" name="email" type="email" placeholder="YOU@EXAMPLE.COM" required />
            </div>
          </div>

          <div style="height: 24px"></div>

          <div>
            <label for="handle">Instagram Handle (Optional)</label>
            <input class="input" id="handle" name="instagram" placeholder="@YOURHANDLE" />
          </div>

          <div style="height: 24px"></div>

          <div>
            <label for="msg">Message</label>
            <textarea class="input" id="msg" name="message" placeholder="ENTER YOUR MESSAGE HERE" required></textarea>
          </div>

          <div style="height: 32px"></div>
          <button class="btn primary" type="submit" style="min-width: 160px;">
            Send Message
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- 🔥 Footer -->
  <footer class="footer">
    <div class="container footerRow">
      <span>© <span id="year"></span> Streetz X Safe ATL</span>
      <span class="muted">We respond when it's time. Ride safe.</span>
    </div>
  </footer>

  <script src="script.js"></script>

  <script>
    const form = document.getElementById("contactform");
    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const data = new FormData(form);
      
      try {
        const response = await fetch("https://formspree.io/f/mjgagdlo", {
          method: "POST",
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          alert("Message sent successfully!");
          form.reset();
        } else {
          alert("Something went wrong. Please try again.");
        }
      } catch (err) {
        console.error("Formspree error:", err);
        alert("Network error. Please try again later.");
      }
    });
  </script>
</body>
</html>
