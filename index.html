<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streetz X Safe ATL • Enter Site</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="gate">

  <!-- Background Video (Fits the page, centered, no zooming/cropping) -->
  <div class="video-container">
    <video autoplay muted loop playsinline>
      <source src="assets/intro.mp4" type="video/mp4" />
      <!-- Fallback color if video doesn't play -->
    </video>
  </div>

  <!-- Screen Darkener Overlay for Typography Readability -->
  <div class="gateOverlay"></div>

  <!-- Splash Screen Content Card -->
  <div class="gateWrap">
    <div class="gateCard">
      <!-- Logo -->
      <img src="assets/logo.jpg" class="gateLogo" alt="Streetz X Safe ATL Logo" />
      
      <!-- Title -->
      <h1 class="gateTitle">Streetz X Safe</h1>
      <p class="gateSub">Stay Safe • Ride Hard • Rep the Movement</p>
      
      <!-- Enter Site Button -->
      <a href="merch.html" class="btn primary gateBtn">Enter Site</a>
      
      <div class="gateDivider"></div>
      
      <!-- Newsletter / Group Chat Signup -->
      <div class="gateFormWrap">
        <h3>Early Access to Drops & Updates</h3>
        <form class="gateForm" onsubmit="alert('Subscribed! Stay safe on the road.'); this.reset(); return false;">
          <input type="email" placeholder="ENTER YOUR EMAIL" class="input" required />
          <button type="submit" class="btn">JOIN</button>
        </form>
      </div>
      
      <!-- Social Connections -->
      <div class="gateSocials">
        <a href="https://www.instagram.com/streetzaintsafeatl" target="_blank" rel="noopener noreferrer" class="gateSocialLink" title="Follow on Instagram">
          <!-- Inline High-Quality SVG Instagram Icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
